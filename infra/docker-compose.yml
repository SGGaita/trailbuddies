# Local stack (Docker Desktop) and, with the "prod" profile, the VPS.
#   Local:  docker compose -f infra/docker-compose.yml --env-file infra/.env up -d db redis api worker
#   VPS:    docker compose -f infra/docker-compose.yml --env-file infra/.env --profile prod up -d
name: trailbuddies

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trailbuddies}
      POSTGRES_USER: ${POSTGRES_USER:-trailbuddies}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trailbuddies} -d ${POSTGRES_DB:-trailbuddies}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: ../services/api
    image: ${API_IMAGE:-trailbuddies-api:local}
    environment:
      TB_ENV: ${TB_ENV:-development}
      TB_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-trailbuddies}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-trailbuddies}
      TB_REDIS_URL: redis://redis:6379/0
      TB_CORS_ORIGINS: ${TB_CORS_ORIGINS:-["http://localhost:3000"]}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      retries: 6
    restart: unless-stopped

  worker:
    image: ${API_IMAGE:-trailbuddies-api:local}
    command: ["arq", "app.worker.WorkerSettings"]
    environment:
      TB_ENV: ${TB_ENV:-development}
      TB_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-trailbuddies}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-trailbuddies}
      TB_REDIS_URL: redis://redis:6379/0
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  caddy:
    profiles: ["prod"]
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
