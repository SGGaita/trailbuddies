name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-packages:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Unit tests (packages)
        run: pnpm test
      - name: Validate content
        run: pnpm content:validate
      - name: Build web app
        run: pnpm --filter @trailbuddies/web build
      - name: Install Playwright browser
        run: pnpm --filter @trailbuddies/web exec playwright install --with-deps chromium
      - name: End-to-end at phone, tablet and desktop sizes
        run: pnpm --filter @trailbuddies/web e2e
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: apps/web/e2e/screenshots
          if-no-files-found: ignore

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: trailbuddies
          POSTGRES_USER: trailbuddies
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trailbuddies" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TB_DATABASE_URL: postgresql+psycopg://trailbuddies:ci-only@localhost:5432/trailbuddies
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Migrations on Postgres (up, down, up)
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: Tests
        run: pytest -q
