name: Migrate production database

# Vercel functions don't run migrations (ADR 0006). This applies them to Supabase after a
# merge that adds one, or when started by hand (Actions > Migrate production database > Run).
# Secret: TB_MIGRATE_DATABASE_URL = Supabase *session* pooler (port 5432), see docs/vercel-supabase.md.
on:
  push:
    branches: [main]
    paths: ["services/api/alembic/**"]
  workflow_dispatch:

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    # Add required reviewers to the "production" environment to approve each run.
    environment: production
    defaults:
      run:
        working-directory: services/api
    env:
      TB_MIGRATE_DATABASE_URL: ${{ secrets.TB_MIGRATE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Check the secret is set
        run: |
          if [ -z "$TB_MIGRATE_DATABASE_URL" ]; then
            echo "::notice::TB_MIGRATE_DATABASE_URL is not set yet; skipping (see docs/vercel-supabase.md)."
            echo "skip=1" >> "$GITHUB_ENV"
          fi
      - name: Current revision
        if: env.skip != '1'
        run: alembic current
      - name: Upgrade to head
        if: env.skip != '1'
        run: alembic upgrade head && alembic current
