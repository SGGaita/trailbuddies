      <button style="height: 64px; border-radius: 14px; border: 2px solid #B9B9B3; background: #F7F7F5; font-size: 24px; color: #1E1E1C;">5</button>
      <button style="height: 64px; border-radius: 14px; border: 2px solid #B9B9B3; background: #F7F7F5; font-size: 24px; color: #1E1E1C;">6</button>

      <button style="height: 64px; border-radius: 14px; border: 2px solid #B9B9B3; background: #F7F7F5; font-size: 24px; color: #1E1E1C;">9</button>
      <button style="height: 64px; border-radius: 14px; border: 2px solid #B9B9B3; background: #F7F7F5; font-size: 24px; color: #1E1E1C;">0</button>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 15px; color: #55554F;">
      <a href="P08-ParentHome.dc.html">Hold for 3 seconds instead</a>
